<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Webhook Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-lg bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-2xl">
        <div class="flex items-center justify-between mb-6 border-b border-gray-800 pb-4">
            <h2 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
                <span>⚡</span> Webhook Command Center
            </h2>
            <span class="text-xs bg-indigo-950 text-indigo-300 px-2.5 py-1 rounded-full border border-indigo-800/50">Online</span>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex gap-2 mb-6 bg-gray-950 p-1 rounded-xl border border-gray-800">
            <button onclick="switchTab('message')" id="tab-message" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition-all">Message</button>
            <button onclick="switchTab('embed')" id="tab-embed" class="flex-1 py-2 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition-all">Rich Embed</button>
            <button onclick="switchTab('quick')" id="tab-quick" class="flex-1 py-2 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition-all">Quick Actions</button>
        </div>

        <!-- TAB 1: Simple Message -->
        <div id="content-message" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Standard Message</label>
                <textarea id="msgContent" rows="4" placeholder="Type something to broadcast..." class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-gray-200 focus:outline-none focus:border-indigo-500 transition-colors resize-none"></textarea>
            </div>
            <button onclick="sendSimpleMessage()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition-colors shadow-lg shadow-indigo-600/20">
                Send Message
            </button>
        </div>

        <!-- TAB 2: Rich Embed Creator -->
        <div id="content-embed" class="space-y-3 hidden">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Embed Title</label>
                <input type="text" id="embedTitle" placeholder="Notification Title" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Description</label>
                <textarea id="embedDesc" rows="3" placeholder="Embed body text..." class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-gray-200 focus:outline-none focus:border-indigo-500 transition-colors resize-none"></textarea>
            </div>
            <div class="flex gap-3">
                <div class="flex-1">
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Accent Color</label>
                    <input type="color" id="embedColor" value="#6366f1" class="w-full h-10 bg-gray-950 border border-gray-800 rounded-xl px-2 cursor-pointer">
                </div>
            </div>
            <button onclick="sendEmbedMessage()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition-colors shadow-lg shadow-indigo-600/20 mt-2">
                Send Rich Embed
            </button>
        </div>

        <!-- TAB 3: Quick Actions -->
        <div id="content-quick" class="space-y-3 hidden">
            <p class="text-xs text-gray-400 mb-2">Clicking these instantly fires preset webhook notifications:</p>
            <button onclick="sendPreset('🟢 System Online & Ready')" class="w-full bg-gray-950 hover:bg-gray-800 border border-gray-800 text-left px-4 py-3 rounded-xl text-sm font-medium text-emerald-400 transition-colors flex items-center justify-between">
                <span>System Online Notice</span>
                <span>→</span>
            </button>
            <button onclick="sendPreset('💤 Going AFK / Brb')" class="w-full bg-gray-950 hover:bg-gray-800 border border-gray-800 text-left px-4 py-3 rounded-xl text-sm font-medium text-amber-400 transition-colors flex items-center justify-between">
                <span>Going AFK Alert</span>
                <span>→</span>
            </button>
            <button onclick="sendPreset('🚨 Emergency / Panic Ping triggered!')" class="w-full bg-gray-950 hover:bg-gray-800 border border-gray-800 text-left px-4 py-3 rounded-xl text-sm font-medium text-rose-400 transition-colors flex items-center justify-between">
                <span>Panic Button Alert</span>
                <span>→</span>
            </button>
        </div>

        <!-- Status Notification Box -->
        <div id="statusMessage" class="text-xs text-center font-medium mt-4 hidden p-2.5 rounded-lg"></div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1538637031352176650/ssm1Qv1OBviQeZio5Bjk49Xk8L4kq64o84uo91kaTgQJIgnvbSSQzo53slUxTApy_1ml";

        function switchTab(tab) {
            ['message', 'embed', 'quick'].forEach(t => {
                document.getElementById(`content-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = "flex-1 py-2 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition-all";
            });
            document.getElementById(`content-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition-all";
        }

        async function postToDiscord(payload) {
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (response.ok || response.status === 204) {
                    showStatus("Dispatched to Discord successfully!", "bg-emerald-950 text-emerald-300 border border-emerald-800/50");
                } else {
                    showStatus(`Error: ${response.status}`, "bg-rose-950 text-rose-300 border border-rose-800/50");
                }
            } catch (error) {
                showStatus("Network connection failed.", "bg-rose-950 text-rose-300 border border-rose-800/50");
            }
        }

        function sendSimpleMessage() {
            const content = document.getElementById('msgContent').value.trim();
            if (!content) return showStatus("Please write a message.", "bg-amber-950 text-amber-300 border border-amber-800/50");
            postToDiscord({ content });
            document.getElementById('msgContent').value = "";
        }

        function sendEmbedMessage() {
            const title = document.getElementById('embedTitle').value.trim();
            const description = document.getElementById('embedDesc').value.trim();
            const hexColor = document.getElementById('embedColor').value;
            const decimalColor = parseInt(hexColor.replace("#", ""), 16);

            if (!title && !description) return showStatus("Add at least a title or description.", "bg-amber-950 text-amber-300 border border-amber-800/50");

            postToDiscord({
                embeds: [{
                    title: title || "Notification",
                    description: description || "",
                    color: decimalColor,
                    timestamp: new Date().toISOString()
                }]
            });
            document.getElementById('embedTitle').value = "";
            document.getElementById('embedDesc').value = "";
        }

        function sendPreset(text) {
            postToDiscord({ content: text });
        }

        function showStatus(text, className) {
            const status = document.getElementById('statusMessage');
            status.innerText = text;
            status.className = `text-xs text-center font-medium mt-4 p-2.5 rounded-lg block ${className}`;
            setTimeout(() => status.classList.add('hidden'), 4000);
        }
    </script>
</body>
</html>
