<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Webhook Sender</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-2xl">
        <h2 class="text-xl font-bold mb-4 text-indigo-400 flex items-center gap-2">
            <span>💬</span> Discord Webhook Sender
        </h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Message / URL</label>
                <!-- Added autofocus so it's ready to type instantly -->
                <textarea id="messageInput" rows="4" autofocus placeholder="Type your message here..." class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-gray-200 focus:outline-none focus:border-indigo-500 transition-colors resize-none"></textarea>
            </div>

            <button id="sendBtn" onclick="sendWebhook()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition-colors shadow-lg shadow-indigo-600/20">
                Send to Discord
            </button>

            <div id="statusMessage" class="text-xs text-center font-medium hidden"></div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1538637031352176650/ssm1Qv1OBviQeZio5Bjk49Xk8L4kq64o84uo91kaTgQJIgnvbSSQzo53slUxTApy_1ml";

        // Keeps focus locked on the input box even if the user clicks away briefly
        window.onload = function() {
            const input = document.getElementById('messageInput');
            input.focus();
            
            // Allow pressing 'Enter' to send (unless holding Shift for a newline)
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendWebhook();
                }
            });
        };

        async function sendWebhook() {
            const input = document.getElementById('messageInput');
            const btn = document.getElementById('sendBtn');
            
            const content = input.value.trim();
            if (!content) {
                showStatus("Please enter a message first.", "text-red-400");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Sending...";

            try {
                // Check if the input is an image URL
                let payload = {};
                if (content.startsWith("http://") || content.startsWith("https://")) {
                    payload = {
                        embeds: [{
                            title: "🖼️ Image Dispatch",
                            color: 65280,
                            image: { url: content }
                        }]
                    };
                } else {
                    payload = { content: content };
                }

                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok || response.status === 204) {
                    showStatus("Message sent successfully!", "text-green-400");
                    input.value = "";
                } else {
                    showStatus(`Failed to send: ${response.status}`, "text-red-400");
                }
            } catch (error) {
                showStatus("Network error occurred.", "text-red-400");
            } finally {
                btn.disabled = false;
                btn.innerText = "Send to Discord";
                input.focus(); // Refocus after sending
            }
        }

        function showStatus(text, colorClass) {
            const status = document.getElementById('statusMessage');
            status.innerText = text;
            status.className = `text-xs text-center font-medium ${colorClass} block`;
            setTimeout(() => {
                status.classList.add('hidden');
            }, 4000);
        }
    </script>
</body>
</html>
